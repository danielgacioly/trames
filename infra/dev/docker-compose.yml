# Serviços para desenvolvimento local: Postgres, storage S3 (moto) e antivírus (ClamAV).
#   docker compose -f infra/dev/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trames
    ports: ["5432:5432"]
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-papeis.sql:ro
      - pg:/var/lib/postgresql/data

  # S3 local (moto). Guarda os arquivos na memória: se o container reiniciar,
  # rode `pnpm storage && pnpm db:seed` de novo.
  s3:
    image: motoserver/moto:5.2.4
    ports: ["9000:5000"]

  clamav:
    # Variante Debian: tem imagem arm64 (Mac com Apple Silicon); a padrão é só amd64.
    image: clamav/clamav-debian:1.4
    ports: ["3310:3310"]

volumes:
  pg:
