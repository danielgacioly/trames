# Serviços para desenvolvimento local: Postgres, storage S3 (MinIO) e antivírus (ClamAV).
#   docker compose -f infra/dev/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trames
    ports: ["5432:5432"]
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-papeis.sql:ro
      - pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: teste
      MINIO_ROOT_PASSWORD: teste-teste
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5174
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]

volumes:
  pg:
  minio:
